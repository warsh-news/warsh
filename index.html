<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#065f46">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>بوابة ورش الإخبارية</title>
</head>
<body style="margin:0;background:#065f46;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center">
<div><h2 style="margin:0 0 8px">بوابة ورش الإخبارية</h2><p style="font-size:13px;color:#a7f3d0">جاري فتح البوابة...</p></div>
<script>
(async()=>{
window.__WARSH_LOADED_FROM_BUNDLE__=true;
const K="warsh_full_html_v3";
const U="https://firestore.googleapis.com/v1/projects/quran-institute-37b61/databases/(default)/documents/warsh_settings/site_bundle";
let h=localStorage.getItem(K);
try{const r=await fetch(U);const j=await r.json();if(j&&j.fields&&j.fields.html&&j.fields.html.stringValue){h=j.fields.html.stringValue;localStorage.setItem(K,h);}}catch(e){}
if(h){document.open();document.write(h);document.close();}
})();
</script>
</body>
</html>
